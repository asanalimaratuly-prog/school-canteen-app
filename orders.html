<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Столовая — Заказы</title>

  <!-- Bootstrap (как у тебя на сайте) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body { background:#f7f7fb; }
    .badge-status { font-size:.85rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .card-order { border:1px solid rgba(0,0,0,.08); border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.04); }
    .small-muted { color:#6c757d; font-size:.9rem; }
  </style>
</head>

<body>
  <div class="container py-4">
    <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
      <div>
        <h3 class="mb-1">🍽️ Столовая — Заказы</h3>
        <div class="small-muted">Список обновляется автоматически (Firestore).</div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-secondary" href="./index.html">← На сайт</a>
        <button class="btn btn-outline-primary" id="btnSignIn">Войти (Google)</button>
        <button class="btn btn-outline-danger d-none" id="btnSignOut">Выйти</button>
      </div>
    </div>

    <hr class="my-3"/>

    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-4">
        <label class="form-label">Фильтр статуса</label>
        <select id="statusFilter" class="form-select">
          <option value="all">Все</option>
          <option value="new">Новые</option>
          <option value="cooking">Готовится</option>
          <option value="ready">Готово</option>
          <option value="done">Выдано</option>
          <option value="cancelled">Отмена</option>
        </select>
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Поиск (класс/имя/ID)</label>
        <input id="search" class="form-control" placeholder="6A, Айжан, 8xK..." />
      </div>

      <div class="col-12 col-md-4 d-flex gap-2">
        <button id="btnRefresh" class="btn btn-primary w-100">Обновить</button>
        <button id="btnSound" class="btn btn-outline-secondary" title="Звук на новый заказ">🔔</button>
      </div>
    </div>

    <div class="mt-3" id="authInfo" class="small-muted"></div>

    <div class="mt-3" id="status" class="small-muted">Загрузка…</div>

    <div class="mt-3" id="ordersList" class="d-grid gap-3"></div>
  </div>

  <script type="module" src="./orders.js"></script>
</body>
</html>
