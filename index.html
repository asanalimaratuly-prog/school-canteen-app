<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>School Canteen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>🍽️ Школьная столовая</h1>
    <a id="qrLink" class="btn btn-outline-dark btn-sm">QR-ссылка</a>
  </div>

  <div id="status" class="text-secondary mb-3">Загрузка...</div>

  <div class="row">
    <div class="col-md-8">
      <div id="menu" class="row g-3"></div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5>🧺 Корзина</h5>
          <div id="cartList">Корзина пуста</div>
          <hr>
          <b>Итого: <span id="cartTotal">0</span> ₸</b>

          <input id="classInput" class="form-control form-control-sm mt-2" placeholder="Класс (6A)">
          <input id="studentInput" class="form-control form-control-sm mt-2" placeholder="Имя">

          <button id="placeOrderBtn" class="btn btn-success w-100 mt-2" disabled>
            Оформить заказ
          </button>

          <div id="orderMsg" class="small mt-2"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script type="module" src="./app.js"></script>
</body>
</html>
