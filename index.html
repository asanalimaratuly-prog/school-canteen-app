<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>School Canteen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <div class="d-flex align-items-center gap-2 mb-3">
    <span class="fs-2">🍽️</span>
    <h1 class="m-0">Школьная столовая</h1>
  </div>

  <div id="status" class="text-secondary mb-3">Загрузка...</div>

  <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <div class="btn-group" role="group" aria-label="category filters">
        <button id="catAll" class="btn btn-primary btn-sm">Все</button>
        <div id="catBtns" class="btn-group" role="group"></div>
      </div>
      <span class="text-secondary small" id="countText"></span>
    </div>

    <button id="refreshBtn" class="btn btn-outline-primary btn-sm">
      <i class="bi bi-arrow-clockwise"></i> Обновить
    </button>
  </div>

  <div id="menu" class="row g-3"></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
