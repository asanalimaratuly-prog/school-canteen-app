<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>School Canteen</title>

  <!-- Bootstrap (для красивого интерфейса) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background:#f8f9fa; }
    .card { border-radius: 14px; }
    .menu-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .price { font-weight:600; }
    .qty-badge { font-size:12px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand h1 { font-size:28px; margin:0; }
    .muted { color:#6c757d; }
    .sticky-cart { position: sticky; top: 14px; }
    .small-note { font-size:12px; color:#6c757d; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .pill { border:1px solid #dee2e6; border-radius:999px; padding:6px 10px; background:#fff; }
  </style>
</head>

<body>
  <div class="container py-4">
    <div class="topbar mb-3">
      <div class="brand">
        <div style="font-size:30px;">🍽️</div>
        <div>
          <h1>Школьная столовая</h1>
          <div id="status" class="muted">Загрузка…</div>
        </div>
      </div>
<!-- ================== АДМИН-ПАНЕЛЬ ================== -->
<div class="card mt-3" style="max-width: 760px;">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
      <div>
        <b>Админ</b>
        <div id="adminInfo" class="text-muted" style="font-size: 13px;">Не вошли</div>
      </div>
      <div class="d-flex gap-2">
        <button id="btnLogin" class="btn btn-outline-primary btn-sm">Войти (Google)</button>
        <button id="btnLogout" class="btn btn-outline-secondary btn-sm" style="display:none;">Выйти</button>
      </div>
    </div>

    <hr/>

    <div id="adminForm" style="display:none;">
      <div class="row g-2">
        <div class="col-md-4">
          <input id="newNameRu" class="form-control" placeholder="Название RU (Плов)" />
        </div>
        <div class="col-md-4">
          <input id="newNameKz" class="form-control" placeholder="Название KZ (Палау)" />
        </div>
        <div class="col-md-2">
          <input id="newPrice" type="number" class="form-control" placeholder="Цена" />
        </div>
        <div class="col-md-2">
          <select id="newCategory" class="form-select">
            <option value="Горячее">Горячее</option>
            <option value="Напитки">Напитки</option>
            <option value="Выпечка">Выпечка</option>
            <option value="Салат">Салат</option>
          </select>
        </div>
      </div>

      <div class="d-flex align-items-center justify-content-between mt-2 flex-wrap gap-2">
        <label class="d-flex align-items-center gap-2">
          <input id="newAvailable" type="checkbox" checked />
          <span>В наличии</span>
        </label>
        <button id="btnAddMenu" class="btn btn-success">Добавить блюдо</button>
      </div>

      <div id="adminMsg" class="text-muted mt-2" style="font-size: 13px;"></div>
    </div>
  </div>
</div>
<!-- ================== /АДМИН-ПАНЕЛЬ ================== -->

      <div class="d-flex gap-2 align-items-center">
        <button id="qrBtn" class="btn btn-outline-secondary btn-sm">QR-ссылка</button>
      </div>
    </div>

    <div class="row g-3">
      <!-- ЛЕВО: МЕНЮ -->
      <div class="col-lg-8">
        <div class="card p-3">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <h3 class="mb-0">Меню</h3>
            <div class="d-flex gap-2">
              <span class="pill">📅 <span id="today"></span></span>
              <span class="pill">🔥 <span id="itemsCount">0</span> позиций</span>
            </div>
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <input id="search" class="form-control" placeholder="Поиск: плов, компот..." />
            </div>
            <div class="col-md-3">
              <select id="sort" class="form-select">
                <option value="popular">Сортировка: по умолчанию</option>
                <option value="priceAsc">Цена: по возрастанию</option>
                <option value="priceDesc">Цена: по убыванию</option>
                <option value="nameAsc">Название: A→Я</option>
              </select>
            </div>
            <div class="col-md-3">
              <button id="refreshBtn" class="btn btn-outline-primary w-100">Обновить меню</button>
            </div>
          </div>

          <div id="menu" class="menu-grid"></div>

          <div class="small-note mt-3">
            Подсказка: данные берутся из Firestore коллекции <span class="mono">menu</span>.
          </div>
        </div>
      </div>

      <!-- ПРАВО: КОРЗИНА -->
      <div class="col-lg-4">
        <div class="card p-3 sticky-cart">
          <h4 class="mb-2">🛒 Корзина</h4>
          <div id="cartEmpty" class="muted">Корзина пуста</div>

          <div id="cartList" class="list-group mb-3" style="display:none;"></div>

          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="fw-bold">Итого:</div>
            <div class="fw-bold"><span id="total">0</span> ₸</div>
          </div>

          <div class="mb-2">
            <input id="classInput" class="form-control mb-2" placeholder="Класс (6А)" />
            <input id="nameInput" class="form-control" placeholder="Имя" />
          </div>

          <button id="orderBtn" class="btn btn-success w-100">Оформить заказ</button>

          <div class="small-note mt-2">
            Заказ сохраняется в коллекцию <span class="mono">orders</span>.
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка QR -->
  <div class="modal fade" id="qrModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">QR-ссылка на сайт</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2 muted">Открой на телефоне или распечатай QR:</div>
          <div class="d-flex justify-content-center">
            <img id="qrImg" alt="QR" style="max-width:260px;" />
          </div>
          <div class="mt-3">
            <div class="muted">Ссылка:</div>
            <div class="mono" id="siteLink"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Твой код -->
  <script type="module" src="./app.js"></script>
</body>
</html>
