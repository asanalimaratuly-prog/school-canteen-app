<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>School Canteen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <div class="d-flex align-items-center gap-2 mb-3">
    <span class="fs-2">🍽️</span>
    <h1 class="m-0">Школьная столовая</h1>
  </div>

  <div id="status" class="text-secondary mb-3">Загрузка...</div>

  <!-- Панель управления -->
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-5">
          <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input id="searchInput" class="form-control" placeholder="Поиск по названию..." />
            <button id="clearSearch" class="btn btn-outline-secondary" type="button">×</button>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="btn-group btn-group-sm" role="group" aria-label="category filters">
            <button id="catAll" class="btn btn-primary">Все</button>
            <div id="catBtns" class="btn-group" role="group"></div>
          </div>
        </div>

        <div class="col-12 col-md-3 d-flex gap-2 justify-content-md-end">
          <select id="sortSelect" class="form-select form-select-sm" style="max-width: 220px;">
            <option value="name_asc">Сортировка: название A→Я</option>
            <option value="name_desc">Сортировка: название Я→A</option>
            <option value="price_asc">Сортировка: цена ↑</option>
            <option value="price_desc">Сортировка: цена ↓</option>
          </select>

          <button id="refreshBtn" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between mt-2">
        <span class="text-secondary small" id="countText"></span>
        <span class="text-secondary small" id="activeFilters"></span>
      </div>
    </div>
  </div>

  <div id="menu" class="row g-3"></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
