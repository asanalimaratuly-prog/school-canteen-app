<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>School Canteen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .app-card { border: 0; border-radius: 16px; }
    .shadow-soft { box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    .badge-price { font-size: .9rem; }
    .sticky-cart { top: 12px; }
    @media (max-width: 991px){ .sticky-cart { position: static !important; } }
  </style>
</head>

<body class="bg-light">
<div class="container py-4">

  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <div class="d-flex align-items-center gap-2">
      <span class="fs-2">🍽️</span>
      <div>
        <h1 class="h3 m-0">School Canteen</h1>
        <div class="text-secondary small">Онлайн-меню и предзаказ для школьной столовой</div>
      </div>
    </div>
    <a id="qrLink" class="btn btn-outline-dark btn-sm" target="_blank" rel="noreferrer">
      <i class="bi bi-qr-code"></i> Ссылка для QR
    </a>
  </div>

  <div id="status" class="text-secondary mb-3">Загрузка...</div>

  <div class="row g-3">
    <!-- LEFT -->
    <div class="col-12 col-lg-8">
      <div class="card app-card shadow-soft mb-3">
        <div class="card-body">
          <div class="row g-2 align-items-center">
            <div class="col-12 col-md-5">
              <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input id="searchInput" class="form-control" placeholder="Поиск по названию..." />
                <button id="clearSearch" class="btn btn-outline-secondary" type="button">×</button>
              </div>
            </div>

            <div class="col-12 col-md-4">
              <div class="btn-group btn-group-sm" role="group" aria-label="category filters">
                <button id="catAll" class="btn btn-primary">Все</button>
                <div id="catBtns" class="btn-group" role="group"></div>
              </div>
            </div>

            <div class="col-12 col-md-3 d-flex gap-2 justify-content-md-end">
              <select id="sortSelect" class="form-select form-select-sm" style="max-width: 220px;">
                <option value="name_asc">Название A→Я</option>
                <option value="name_desc">Название Я→A</option>
                <option value="price_asc">Цена ↑</option>
                <option value="price_desc">Цена ↓</option>
              </select>

              <button id="refreshBtn" class="btn btn-outline-primary btn-sm" title="Обновить">
                <i class="bi bi-arrow-clockwise"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between mt-2">
            <span class="text-secondary small" id="countText"></span>
            <span class="text-secondary small" id="activeFilters"></span>
          </div>
        </div>
      </div>

      <div id="menu" class="row g-3"></div>
    </div>

    <!-- RIGHT -->
    <div class="col-12 col-lg-4">
      <div class="card app-card shadow-soft position-sticky sticky-cart">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <h2 class="h5 m-0">🧺 Корзина</h2>
            <button id="clearCartBtn" class="btn btn-outline-danger btn-sm">Очистить</button>
          </div>

          <div id="cartList" class="small text-secondary mb-2">Корзина пуста</div>

          <div class="d-flex justify-content-between fw-semibold mb-2">
            <div>Итого:</div>
            <div><span id="cartTotal">0</span> ₸</div>
          </div>

          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label small mb-1">Класс</label>
              <input id="classInput" class="form-control form-control-sm" placeholder="6A" />
            </div>
            <div class="col-6">
              <label class="form-label small mb-1">Имя</label>
              <input id="studentInput" class="form-control form-control-sm" placeholder="Айбек" />
            </div>
          </div>

          <button id="placeOrderBtn" class="btn btn-success w-100" disabled>
            <i class="bi bi-check2-circle"></i> Оформить заказ
          </button>

          <div id="orderMsg" class="small mt-2"></div>

          <div class="text-secondary small mt-3">
            * На перемене просто назови номер заказа и оплати на месте.
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script type="module" src="./app.js"></script>
</body>
</html>
